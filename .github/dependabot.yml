# Weekly updates. Minor and patch versions come grouped in one PR per ecosystem; a major version gets its own PR,
# since it may need code changes.
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types: [ "minor", "patch" ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types: [ "minor", "patch" ]
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types: [ "minor", "patch" ]
- package-ecosystem: gradle
  directory: "/android"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types: [ "minor", "patch" ]
