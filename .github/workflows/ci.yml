name: CI

# Une PR passe par : secrets, sécurité, lint, tests. Voir docs/tests.md.
# Déclencheurs par défaut de pull_request (opened, synchronize, reopened) : un label ne relance
# jamais la CI, sinon des jobs « skipped » seraient comptés comme réussis par les checks obligatoires.

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Recherche de secrets dans l'historique
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  scan_ruby:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Scan for known security vulnerabilities in JavaScript packages
        run: bin/yarn-audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Pas de sleep dans les specs (attentes Capybara uniquement)
        run: bin/check-specs

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips node-gyp

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install JavaScript packages
        run: yarn install --frozen-lockfile

      - name: Build JS et CSS (requis par les system specs)
        run: yarn build && yarn build:css

      - name: Préparer la base de test
        run: bin/rails db:test:prepare

      - name: Tests Ruby (dont end to end), 10 specs les plus lentes affichées
        run: bundle exec rspec --profile 10

      - name: Stabilité des system specs modifiées (3 passages, ordre aléatoire)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'spec/system/*_spec.rb')
          if [ -z "$files" ]; then echo "Aucune system spec modifiée."; exit 0; fi
          # shellcheck disable=SC2086 # découpage voulu : une spec par mot
          for i in 1 2 3; do
            echo "::group::Passage $i"
            bundle exec rspec $files --order random
            echo "::endgroup::"
          done

      - name: Captures d'écran des system specs en échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-system-specs
          path: tmp/capybara
          if-no-files-found: ignore

      - name: Tests JavaScript
        run: yarn test

      - name: Seeds
        run: bin/rails db:seed:replant