# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# Project conventions checked mechanically (see CLAUDE.md).
# Time zone: never Time.now / Date.today, always Time.current / Time.zone.today.
Rails/TimeZone:
  Enabled: true
  EnforcedStyle: strict

Rails/Date:
  Enabled: true
  EnforcedStyle: strict

# No hardcoded text in messages (I18n).
Rails/I18nLocaleTexts:
  Enabled: true
