<% local = YAML.load_file("config/application.yml").fetch("production") %>

# Name of your application. Used to uniquely configure containers.
service: easy_home

# Name of the container image (use your-user/app-name on external registries).
image: lvcode/easy-home

# Deploy to these servers.
servers:
  web:
    - <%= local.fetch("KAMAL_HOST") %>
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
proxy:
  ssl: false
  host: <%= local.fetch("APP_HOST") %>
  run:
    publish: false

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  # server: hub.docker.com

  # Needed for authenticated registries.
  username: lvcode

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DB_USER
    - DB_PASSWORD
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    APP_HOST: <%= local.fetch("APP_HOST") %>
    # Sender of the emails, on a real domain: kept in config/application.yml, out of the repository (ADR 0018).
    MAIL_FROM: <%= local.fetch("MAIL_FROM") %>

    # Thruster refuses request bodies over 20 MB before they reach Rails: photos are limited to 15 MB
    # (PhotoUpload), the margin covers the rest of the multipart form. See ADR 0011.
    MAX_REQUEST_BODY: 20971520

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use easy_home-db for a db accessory server on same machine via local kamal docker network.
    # PostgreSQL accessory on the same machine, through the Kamal Docker network.
    DB_HOST: easy_home-db

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "easy_home_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 4.0.7
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
ssh:
  user: <%= local.fetch("KAMAL_SSH_USER") { "root"} %>

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:18
    host: <%= local.fetch("KAMAL_HOST") %>
    # Only exposed locally on the server (access through an SSH tunnel if needed).
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: easy_home_production
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    directories:
      # postgres:18 expects the volume on /var/lib/postgresql (no longer .../data)
      - data:/var/lib/postgresql

  tunnel:
    image: cloudflare/cloudflared:2026.11.2
    host: <%= local.fetch("KAMAL_HOST") %>
    cmd: tunnel run
    env:
      secret:
        - TUNNEL_TOKEN
  backup:
    image: lvcode/easy-home-backup:<%= `git rev-parse --short=12 HEAD:backup`.strip %>
    host: <%= local.fetch("KAMAL_HOST") %>
    env:
      clear:
        TZ: Indian/Reunion
        PGHOST: easy_home-db
      secret:
        - PGUSER:POSTGRES_USER
        - PGPASSWORD:POSTGRES_PASSWORD
        - RESTIC_REPOSITORY
        - RESTIC_PASSWORD
        - AWS_ACCESS_KEY_ID:R2_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY:R2_SECRET_ACCESS_KEY
        - HEALTHCHECK_URL:BACKUP_HEALTHCHECK_URL
    volumes:
      - easy_home_storage:/storage:ro

# Examples generated by Rails:
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
