# PostgreSQL (see docs/decisions/0004-base-de-donnees.md)
#
# In development and test, local socket connection (Postgres.app, Homebrew...).
# DATABASE_URL, when set, overrides this configuration.
default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch("DB_USER") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: easy_home_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: easy_home_test

# Production: one PostgreSQL server (Kamal accessory "db"), four databases.
# Solid Cache, Solid Queue and Solid Cable each have their own database.
production:
  primary: &primary_production
    <<: *default
    host: <%= ENV["DB_HOST"] %>
    username: <%= ENV["DB_USER"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    database: easy_home_production
  cache:
    <<: *primary_production
    database: easy_home_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: easy_home_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: easy_home_production_cable
    migrations_paths: db/cable_migrate
